name: CI

# Every job runs only on a public repo, where GitHub-hosted runners are free.
# On a private repo macOS minutes are billed, so the jobs skip themselves there.
# A run whose jobs all skip still shows as "success": check the job conclusions,
# not the run's. The repo is public, so the jobs run and their result is the gate.
# If the repo is private again, CI proves nothing. Then test locally with only what
# changed: `Scripts/xcb.sh test --scheme CatCareCalendarTests --only <Suite>` for the
# changed tests and the suites of the changed files, and `cd functions && npm test`.
# The `app` job runs the unit tests with coverage. The `ui-tests` job runs the UI tests, on the
# iOS runtime that matches the runner's simulator SDK only (owner decision, 2026-10-12; no iOS 18.5
# pass in CI). It runs in parallel with `app` on every push to main and manual run. On a PR it runs
# only when the PR changes CatCareCalendar/**, CatCareCalendarUITests/**, *.xcodeproj/** or
# .github/workflows/** (the `changes` job decides); a docs-only PR skips it. A UI test that
# passes only on retry is listed in the job log.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect UI-test paths
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide if the UI tests must run
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA"...HEAD | tee changed.txt
          if grep -qE '^(CatCareCalendar/|CatCareCalendarUITests/|[^/]+\.xcodeproj/|\.github/workflows/)' changed.txt; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "No app, UI-test, project or workflow change: UI tests skipped."
          fi
  app:
    name: Build, unit tests, coverage, Release build
    if: ${{ !github.event.repository.private }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MINIMUM_LINE_COVERAGE: "17.5"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ci-spm
          key: spm-${{ hashFiles('CatCareCalendar.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # No GoogleService-Info.plist in the repo: the app builds and runs with the cloud tier off.
      - name: Run unit tests with coverage
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          echo "Simulator: $UDID"
          mkdir -p TestResults
          xcodebuild test \
            -project CatCareCalendar.xcodeproj \
            -scheme CatCareCalendar \
            -testPlan CatCareCalendar \
            -destination "id=$UDID" \
            -skip-testing:CatCareCalendarUITests \
            -resultBundlePath TestResults/CatCareCalendar.xcresult \
            -clonedSourcePackagesDirPath ~/Library/Caches/ci-spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1 || { grep -E 'error:|failed|Failing tests' test.log | head -80; exit 1; }
          grep -E 'Executed|Test run with|TEST SUCCEEDED' test.log | tail -n 5

      - name: Enforce app coverage floor
        run: |
          bash Scripts/check_coverage.sh \
            TestResults/CatCareCalendar.xcresult \
            "${MINIMUM_LINE_COVERAGE}"

      # The archive for TestFlight builds Release for a device. Debug-only code (#if DEBUG) that
      # Release code still calls compiles in the steps above and fails only here.
      - name: Build Release for device
        run: |
          xcodebuild build \
            -project CatCareCalendar.xcodeproj \
            -scheme CatCareCalendar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath ~/Library/Caches/ci-spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            > release.log 2>&1 || { grep -E 'error:' release.log | head -50; exit 1; }
          tail -n 3 release.log

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: |
            TestResults/CatCareCalendar.xcresult
            test.log
            release.log
          if-no-files-found: ignore

  ui-tests:
    name: UI tests
    needs: changes
    if: ${{ !github.event.repository.private && needs.changes.outputs.ui == 'true' }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ci-spm
          key: spm-${{ hashFiles('CatCareCalendar.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: List simulator runtimes
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available

      # The simulator is the first iPhone on the runtime that matches the simulator SDK of the
      # selected Xcode. If no runtime matches, the newest runtime by version number is used.
      # A failed test runs once more. A test that passes only on retry stays in the log.
      - name: Run UI tests
        run: |
          export SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "Simulator SDK: $SDK"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, re, sys
          d = json.load(sys.stdin)["devices"]
          def version(r):
              m = re.search(r"iOS-(\d+(?:-\d+)*)$", r)
              return tuple(int(n) for n in m.group(1).split("-")) if m else None
          runtimes = [r for r in d if version(r) and any(x["name"].startswith("iPhone") for x in d[r])]
          want = tuple(int(n) for n in os.environ["SDK"].split("."))
          match = [r for r in runtimes if version(r)[:len(want)] == want]
          runtime = max(match or runtimes, key=version)
          print("Runtime:", runtime, file=sys.stderr)
          print(next(x["udid"] for x in d[runtime] if x["name"].startswith("iPhone")))
          ')
          echo "Simulator: $UDID"
          xcrun simctl list devices available | grep "$UDID"
          mkdir -p TestResults
          xcodebuild test \
            -project CatCareCalendar.xcodeproj \
            -scheme CatCareCalendar \
            -testPlan CatCareCalendar \
            -destination "id=$UDID" \
            -only-testing:CatCareCalendarUITests \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -enableCodeCoverage NO \
            -resultBundlePath TestResults/CatCareCalendarUITests.xcresult \
            -clonedSourcePackagesDirPath ~/Library/Caches/ci-spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            > ui-test.log 2>&1 || { grep -E 'error:|failed|Failing tests' ui-test.log | head -80; exit 1; }
          echo "UI tests that failed at least once (passed on retry if the run is green):"
          grep -iE "Test case .* failed" ui-test.log | sort -u || true
          grep -E 'Executed|TEST SUCCEEDED' ui-test.log | tail -n 5

      - name: Upload UI test results and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            TestResults/CatCareCalendarUITests.xcresult
            ui-test.log
          retention-days: 14
          if-no-files-found: ignore

  functions:
    name: Cloud Function tests
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
