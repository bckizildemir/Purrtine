name: CI

# Every job runs only on a public repo, where GitHub-hosted runners are free.
# On a private repo macOS minutes are billed, so the jobs skip themselves there.
# A run whose jobs all skip still shows as "success": check the job conclusions,
# not the run's. The repo is public, so the jobs run and their result is the gate.
# If the repo is private again, CI proves nothing. Then test locally with only what
# changed: `Scripts/xcb.sh test --scheme PurrtineTests --only <Suite>` for the
# changed tests and the suites of the changed files, and `cd functions && npm test`.
# The `app` job runs the unit tests with coverage. The `ui-tests` job runs the UI tests, on the
# iOS runtime that matches the runner's simulator SDK only (owner decision, 2026-10-12; no iOS 18.5
# pass in CI). The `changes` job decides which of the two run (its comment has the rules). A manual
# run runs both. On a PR and on a push to main (diffed against the commit before it), `app` is
# skipped when only docs, agent files or Cloud Function files changed, and `ui-tests` is skipped
# unless Purrtine/**, PurrtineUITests/**, *.xcodeproj/** or .github/workflows/** changed. The
# `ui-tests` job runs in parallel with `app`. It has a 60 minute
# limit: green runs took 32-38 minutes (2026-11-13..15), and a run that retries tests needs room
# (#152). The run step prints a retry summary: which tests passed only on retry, and which failed
# without recovering (#97). The retry flags work; a test suite whose runner exits after a failure
# defeats them (an `async` tearDown did, #152).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only a pull request run is cancelled by a newer push. Two runs on main both finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # A pull request is compared with its base, a push to main with the commit before it. A manual
      # run, a push whose previous commit is not in the clone (a force push) and any failure to diff
      # run everything.
      #
      # ui:  the UI tests run when the change touches the app, the UI tests, the project or a workflow.
      # app: the `app` job runs unless every changed file is one the build and unit tests cannot see:
      #      Markdown at the root, docs/, documentation/, .claude/, the Cloud Function folder and the
      #      Firebase config, LICENSE, skills-lock.json and the Dependabot config. This is a deny-list on purpose: a new kind
      #      of file builds until it is added here. Markdown under Purrtine/ or Scripts/ can still be a
      #      bundle resource or script input, so only root Markdown is excluded.
      #
      # `app` is a required check. A job skipped by its `if:` reports "Success" to a required check
      # (GitHub docs, "Troubleshooting required status checks": a job skipped by a conditional
      # "reports Success"; a whole workflow skipped by path filtering stays Pending and blocks
      # merging, so keep the path filter inside the jobs and never on the `on:` triggers).
      - name: Decide which jobs must run
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          write() {
            echo "ui=$1" >> "$GITHUB_OUTPUT"
            echo "app=$2" >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA...HEAD"
          elif [ "$EVENT" = "push" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="$BEFORE_SHA..HEAD"
          else
            echo "No diff base for a $EVENT event: everything runs."
            write true true
            exit 0
          fi
          if ! git diff --name-only "$range" > changed.txt; then
            echo "git diff $range failed: everything runs."
            write true true
            exit 0
          fi
          cat changed.txt

          if grep -qE '^(Purrtine/|PurrtineUITests/|[^/]+\.xcodeproj/|\.github/workflows/)' changed.txt; then
            ui=true
          else
            ui=false
            echo "No app, UI-test, project or workflow change: UI tests skipped."
          fi

          if grep -vE '^([^/]+\.md|docs/|documentation/|\.claude/|functions/|firebase\.json|\.firebaserc|LICENSE|skills-lock\.json|\.github/dependabot\.yml)' changed.txt | grep -q .; then
            app=true
          else
            app=false
            echo "Only docs, agent files or Cloud Function files changed: build and unit tests skipped."
          fi
          write "$ui" "$app"

  app:
    name: Build, unit tests, coverage, Release build
    needs: changes
    # Required check: a skip through this `if:` counts as passing. If the `changes` job itself fails,
    # run: a broken filter must not skip the build.
    if: ${{ !cancelled() && !github.event.repository.private && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MINIMUM_LINE_COVERAGE: "17.5"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/ci-spm
          key: spm-${{ hashFiles('Purrtine.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # The picker sorts runtimes by number (iOS 26.10 beats 26.6) and prefers a plain iPhone 17.
      # The same file is in TriQ; keep the two byte-identical.
      - name: Pick a simulator
        run: |
          Scripts/ci-pick-simulator.sh --self-test
          UDID=$(Scripts/ci-pick-simulator.sh)
          echo "Simulator: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      # No GoogleService-Info.plist in the repo: the app builds and runs with the cloud tier off.
      - name: Run unit tests with coverage
        run: |
          mkdir -p TestResults
          xcodebuild test \
            -project Purrtine.xcodeproj \
            -scheme Purrtine \
            -testPlan Purrtine \
            -destination "id=$SIM_UDID" \
            -skip-testing:PurrtineUITests \
            -resultBundlePath TestResults/Purrtine.xcresult \
            -clonedSourcePackagesDirPath ~/Library/Caches/ci-spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1 || { grep -E 'error:|failed|Failing tests' test.log | head -80; exit 1; }
          grep -E 'Executed|Test run with|TEST SUCCEEDED' test.log | tail -n 5

      - name: Enforce app coverage floor
        run: |
          bash Scripts/check_coverage.sh \
            TestResults/Purrtine.xcresult \
            "${MINIMUM_LINE_COVERAGE}"

      # The archive for TestFlight builds Release for a device. Debug-only code (#if DEBUG) that
      # Release code still calls compiles in the steps above and fails only here.
      - name: Build Release for device
        run: |
          xcodebuild build \
            -project Purrtine.xcodeproj \
            -scheme Purrtine \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath ~/Library/Caches/ci-spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            > release.log 2>&1 || { grep -E 'error:' release.log | head -50; exit 1; }
          tail -n 3 release.log

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-results
          path: |
            TestResults/Purrtine.xcresult
            test.log
            release.log
          if-no-files-found: ignore

  ui-tests:
    name: UI tests
    needs: changes
    # If the `changes` job itself fails, run: a broken filter must not skip the tests.
    if: ${{ !cancelled() && !github.event.repository.private && (needs.changes.result != 'success' || needs.changes.outputs.ui == 'true') }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/ci-spm
          key: spm-${{ hashFiles('Purrtine.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Self-test the retry summary
        run: Scripts/ui_test_retry_summary.sh --self-test

      - name: List simulator runtimes
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available

      # The simulator is the first iPhone on the runtime that matches the simulator SDK of the
      # selected Xcode. If no runtime matches, the newest runtime by version number is used.
      # A failed test runs once more; the retry summary below says which tests recovered.
      - name: Run UI tests
        run: |
          export SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "Simulator SDK: $SDK"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, re, sys
          d = json.load(sys.stdin)["devices"]
          def version(r):
              m = re.search(r"iOS-(\d+(?:-\d+)*)$", r)
              return tuple(int(n) for n in m.group(1).split("-")) if m else None
          runtimes = [r for r in d if version(r) and any(x["name"].startswith("iPhone") for x in d[r])]
          want = tuple(int(n) for n in os.environ["SDK"].split("."))
          match = [r for r in runtimes if version(r)[:len(want)] == want]
          runtime = max(match or runtimes, key=version)
          print("Runtime:", runtime, file=sys.stderr)
          print(next(x["udid"] for x in d[runtime] if x["name"].startswith("iPhone")))
          ')
          echo "Simulator: $UDID"
          xcrun simctl list devices available | grep "$UDID"
          mkdir -p TestResults
          status=0
          xcodebuild test \
            -project Purrtine.xcodeproj \
            -scheme Purrtine \
            -testPlan Purrtine \
            -destination "id=$UDID" \
            -only-testing:PurrtineUITests \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -enableCodeCoverage NO \
            -resultBundlePath TestResults/PurrtineUITests.xcresult \
            -clonedSourcePackagesDirPath ~/Library/Caches/ci-spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            > ui-test.log 2>&1 || status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "xcodebuild exited with $status."
          fi
          Scripts/ui_test_retry_summary.sh ui-test.log
          if [[ "$status" -ne 0 ]]; then
            echo "First errors and failures:"
            grep -E 'error:|failed|Failing tests' ui-test.log | head -80 || true
          fi
          grep -E 'Executed|TEST SUCCEEDED' ui-test.log | tail -n 5 || true
          exit "$status"

      - name: Upload UI test results and log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-test-results
          path: |
            TestResults/PurrtineUITests.xcresult
            ui-test.log
          retention-days: 14
          if-no-files-found: ignore

  functions:
    name: Cloud Function tests
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
