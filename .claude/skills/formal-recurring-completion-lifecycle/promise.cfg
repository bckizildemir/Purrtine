\* The gate: the rules the code keeps today. Every completion path, days 0..2, the
\* schedule's end date on day 2, a task shared by two cats, at most 2 completions and
\* 2 open requests at once. Expected result: no rule breaks. Since #141 every rule is in the gate.
CONSTANTS
    MaxDay = 2
    EndDay = 2
    SharedTask = TRUE
    MaxDone = 2
    MaxOpen = 2
    Sources = {"sheet", "calendar", "assistant", "notification"}
    Editing = TRUE

SPECIFICATION Spec
CONSTRAINT Bounds

INVARIANTS
    TypeOK
    OneActiveScheduleOrClosed
    NextIsStrictlyLater
    FailedSaveChangesNothing
    CompletedNeverReappears
    NeverCompletedTwice
    CompletesTheOccurrenceShown
    NoOccurrenceSkipped
