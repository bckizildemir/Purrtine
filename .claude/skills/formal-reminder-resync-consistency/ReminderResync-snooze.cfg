\* The same events plus up to 2 "Remind me" snoozes, 3 events in all; no failed read (the resync config covers it).
CONSTANTS
    Tasks = {1, 2}
    CatOnlyTasks = {1}
    Limit = 1
    SnoozeSlots = 1
    MaxEvents = 3
    MaxSnoozes = 2
    MaxFetchFailures = 0

SPECIFICATION Spec
VIEW StateView

INVARIANTS
    NoSnoozeAfterCompletion
    NoSnoozeForDeletedTask
    OffMeansSilent
    SnoozesWithinSlots
    WithinIOSCap

