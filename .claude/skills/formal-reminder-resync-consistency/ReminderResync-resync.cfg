\* Resync without snoozes: complete, delete (lands or stays staged), edit, cat delete, settings,
\* permission, app activation, cold launch, one failed store read. 2 tasks (task 1 only on the
\* deletable cat), a reminder limit of 1 standing for 59, 1 snooze slot standing for 4.
CONSTANTS
    Tasks = {1, 2}
    CatOnlyTasks = {1}
    Limit = 1
    SnoozeSlots = 1
    MaxEvents = 4
    MaxSnoozes = 0
    MaxFetchFailures = 1

SPECIFICATION Spec
VIEW StateView

INVARIANTS
    ConvergesToStore
    OffMeansSilent
    FailedReadKeepsSet
    WithinIOSCap

